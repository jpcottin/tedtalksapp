name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Validate Compose Preview Screenshots
      run: ./gradlew :app:validateDebugScreenshotTest

    - name: Upload screenshot test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-test-report
        path: app/build/reports/screenshotTest/preview/debug/

    - name: Build Debug APK
      run: ./gradlew assembleDebug

  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-latest
    # API 37.0 (ps16k) is experimental: SurfaceFlinger crashes under swiftshader
    # on the x86_64 image (the only emulator path hosted runners support), so it
    # runs for visibility but does not gate the workflow.
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock google_apis x86_64 images — the baseline legs we expect to pass.
          - api-level: '32'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '33'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '34'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '35'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '36'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          # API 37.0 16 KB page-size image — heavier, needs more RAM. -gpu auto
          # and -gpu lavapipe both panic/loop the ps16k kernel before userspace;
          # swiftshader_indirect is the only mode that boots this image, and even
          # then SurfaceFlinger crashes on x86_64. Kept non-blocking (experimental).
          - api-level: '37.0'
            target: google_apis_ps16k
            ram-size: 4096M
            memory: 4096
            gpu: swiftshader_indirect
            cores: 4
            experimental: true
            extra-options: -feature HasSharedSlotsHostMemoryAllocator

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The Android emulator needs hardware acceleration (KVM) to run an x86_64
    # system image at a usable speed. KVM is available on the Linux runners but
    # the device node needs permissions opened up for the action.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # RAM and GPU mode are matrix-tuned per image (heap-size is left at the
    # emulator default). We cold-boot (-no-snapshot), enlarge the userdata
    # partition so the app APK can stage, allow a generous boot timeout, and
    # hold off adb until boot completes (-delay-adb). cores is matrix-tuned and
    # left to the emulator default where unset.
    - name: Run instrumented tests
      if: matrix.api-level != '37.0'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: ${{ matrix.target }}
        force-avd-creation: true
        ram-size: ${{ matrix.ram-size }}
        cores: ${{ matrix.cores }}
        disk-size: 8192M
        emulator-boot-timeout: 900
        emulator-options: -no-snapshot -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -memory ${{ matrix.memory }} -delay-adb -verbose -show-kernel -debug-metrics -metrics-collection ${{ matrix.extra-options || '' }}
        disable-animations: true
        script: |
          adb wait-for-device
          adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &
          ./gradlew :app:connectedDebugAndroidTest || { echo "=== test run failed; capturing guest diagnostics ==="; adb root >/dev/null 2>&1 || true; adb wait-for-device || true; echo "----- crash logcat buffer -----"; adb logcat -d -b crash 2>/dev/null | tail -n 300 || true; echo "----- /data/tombstones -----"; for f in $(adb shell ls /data/tombstones 2>/dev/null | tr -d '\r'); do case "$f" in *.pb) ;; *) echo "===== $f ====="; adb shell cat "/data/tombstones/$f" 2>/dev/null || true ;; esac; done; exit 1; }

    - name: Run Manual Emulator and Capture Tombstones (API 37)
      if: matrix.api-level == '37.0'
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH

        # 1. Install SDK, tools and system image
        echo "y" | sdkmanager --licenses > /dev/null
        sdkmanager --install "system-images;android-37.0;google_apis_ps16k;x86_64" "platforms;android-37.0" "build-tools;36.0.0" platform-tools emulator --channel=0 > /dev/null

        # 2. Create AVD
        echo "no" | avdmanager create avd --force -n test --package "system-images;android-37.0;google_apis_ps16k;x86_64"
        printf "hw.cpu.ncore=4\nhw.ramSize=4096M\ndisk.dataPartition.size=8192M\n" >> ~/.android/avd/test.avd/config.ini

        # 3. Start Emulator in the background (with logging)
        emulator -port 5554 -avd test -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -delay-adb -verbose -show-kernel -debug-metrics -metrics-collection -feature HasSharedSlotsHostMemoryAllocator > emulator_stdout.log 2>&1 &

        # 4. Wait for boot completion
        echo "Waiting for emulator to boot (up to 300s)..."
        timeout 300 bash -c '
          until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
            sleep 2
          done
        ' || echo "Boot wait timed out or crashed"

        # 5. Trigger the unlock event (known to crash SurfaceFlinger)
        echo "Triggering unlock keyevent to wake up renderer..."
        adb -s emulator-5554 shell input keyevent 82 || echo "Unlock keyevent failed (as expected due to crash)"

        # 6. Wait a moment for tombstoned to write the crash dump
        sleep 5

        # 7. Collect and dump the tombstones
        echo "=== Listing /data/tombstones ==="
        adb -s emulator-5554 shell ls -la /data/tombstones || true

        echo "=== Pulling and Displaying Tombstones ==="
        adb -s emulator-5554 root || true
        adb -s emulator-5554 wait-for-device || true
        for f in $(adb -s emulator-5554 shell ls /data/tombstones 2>/dev/null | tr -d '\r'); do
          echo "===== Tombstone: $f ====="
          adb -s emulator-5554 shell cat "/data/tombstones/$f" 2>/dev/null || true
        done

        # Also dump the end of the emulator log if any
        echo "=== End of Emulator stdout/stderr log ==="
        tail -n 200 emulator_stdout.log || true

        exit 1 # Fail the step to make the failure/logs visible in GHA panel

    - name: Dump guest logcat on failure
      if: failure()
      run: |
        echo "=== Emulator Logcat (last 1000 lines) ==="
        if [ -f "${{ github.workspace }}/emulator_logcat.txt" ]; then
          tail -n 1000 "${{ github.workspace }}/emulator_logcat.txt"
        else
          echo "Logcat file not found."
        fi

    - name: Upload instrumented test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-report-api${{ matrix.api-level }}
        path: app/build/reports/androidTests/connected/
