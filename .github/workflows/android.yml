name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Validate Compose Preview Screenshots
      run: ./gradlew :app:validateDebugScreenshotTest

    - name: Upload screenshot test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-test-report
        path: app/build/reports/screenshotTest/preview/debug/

    - name: Build Debug APK
      run: ./gradlew assembleDebug

  instrumented-tests:
    name: Instrumented Tests (API ${{ matrix.api-level }}${{ matrix.suffix && format(' {0}', matrix.suffix) || '' }} emulator)
    runs-on: ubuntu-latest
    # API 37.0 (ps16k) is experimental and runs for visibility without gating.
    # Root cause of past failures: the default 'stable' SDK channel ships
    # emulator 36.6.11, which predates the 16 KB-page ps16k image. The stale
    # emulator advertises the host GL extension ANDROID_EMU_read_color_buffer_dma,
    # but the image's new gralloc5 mapper (mapper.ranchu) asserts
    # !hasReadColorBufferDma and SurfaceFlinger crash-loops (SIGABRT) — so every
    # test fails to launch its activity. The 37.0 legs therefore pull the emulator
    # from the 'canary' channel (37.x), which matches the image; that pairing runs
    # the suite green on real hardware. See matrix `channel` below.
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Stock google_apis x86_64 images — the baseline legs we expect to pass.
          - api-level: '32'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '33'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '34'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '35'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          - api-level: '36'
            target: google_apis
            ram-size: 2048M
            memory: 2048
            gpu: auto
          # API 37.0 16 KB page-size image — heavier, needs more RAM, and must be
          # paired with a canary-channel emulator (37.x) that understands the image
          # (see the gralloc/read_color_buffer_dma note on the job above). Kept
          # non-blocking (experimental) until the canary pairing proves stable.
          - api-level: '37.0'
            suffix: 'swiftshader'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory: 4096
            gpu: swiftshader_indirect
            cores: 4
            experimental: true
            extra-options: -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator
          - api-level: '37.0'
            suffix: 'lavapipe'
            target: google_apis_ps16k
            channel: canary
            ram-size: 4096M
            memory: 4096
            gpu: lavapipe
            cores: 4
            experimental: true
            extra-options: -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The Android emulator needs hardware acceleration (KVM) to run an x86_64
    # system image at a usable speed. KVM is available on the Linux runners but
    # the device node needs permissions opened up for the action.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # RAM and GPU mode are matrix-tuned per image (heap-size is left at the
    # emulator default). We cold-boot (-no-snapshot), enlarge the userdata
    # partition so the app APK can stage, allow a generous boot timeout, and
    # hold off adb until boot completes (-delay-adb). cores is matrix-tuned and
    # left to the emulator default where unset.
    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        target: ${{ matrix.target }}
        # SDK channel for the emulator + system image. The ps16k API 37.0 legs need
        # 'canary' (newer emulator matched to the image); all others use 'stable'.
        channel: ${{ matrix.channel || 'stable' }}
        force-avd-creation: true
        ram-size: ${{ matrix.ram-size }}
        cores: ${{ matrix.cores }}
        disk-size: 8192M
        emulator-boot-timeout: 900
        emulator-options: -no-snapshot -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none -memory ${{ matrix.memory }} -delay-adb -verbose -show-kernel -debug-metrics -metrics-collection ${{ matrix.extra-options || '' }}
        disable-animations: true
        script: |
          adb wait-for-device
          adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &
          ./gradlew :app:connectedDebugAndroidTest || { echo "=== test run failed; capturing guest diagnostics ==="; adb root >/dev/null 2>&1 || true; adb wait-for-device || true; echo "----- crash logcat buffer -----"; adb logcat -d -b crash 2>/dev/null | tail -n 300 || true; echo "----- /data/tombstones -----"; for f in $(adb shell ls /data/tombstones 2>/dev/null | tr -d '\r'); do case "$f" in *.pb) ;; *) echo "===== $f ====="; adb shell cat "/data/tombstones/$f" 2>/dev/null || true ;; esac; done; exit 1; }

    - name: Dump guest logcat on failure
      if: failure()
      run: |
        echo "=== Emulator Logcat (last 1000 lines) ==="
        if [ -f "${{ github.workspace }}/emulator_logcat.txt" ]; then
          tail -n 1000 "${{ github.workspace }}/emulator_logcat.txt"
        else
          echo "Logcat file not found."
        fi

    - name: Upload instrumented test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-report-api${{ matrix.api-level }}
        path: app/build/reports/androidTests/connected/
