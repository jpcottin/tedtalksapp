name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Validate Compose Preview Screenshots
      run: ./gradlew :app:validateDebugScreenshotTest

    - name: Upload screenshot test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-test-report
        path: app/build/reports/screenshotTest/preview/debug/

    - name: Build Debug APK
      run: ./gradlew assembleDebug

  instrumented-tests:
    name: Instrumented Tests (API 37.0 emulator)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The Android emulator needs hardware acceleration (KVM) to run an x86_64
    # system image at a usable speed. KVM is available on the Linux runners but
    # the device node needs permissions opened up for the action.
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # The ps16k (16 KB page-size) system image is heavier than a stock image and
    # will not finish booting under the runner-default RAM, so we give it 4GB RAM
    # / 768MB heap, cold-boot it (-no-snapshot), and allow a generous boot timeout.
    - name: Run instrumented tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: '37.0'
        arch: x86_64
        target: google_apis_ps16k
        force-avd-creation: true
        ram-size: 4096M
        heap-size: 768M
        emulator-boot-timeout: 900
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -verbose -debug-metrics -metrics-collection
        disable-animations: true
        script: |
          adb wait-for-device
          # Stream guest logcat to a host file so a boot/test failure is diagnosable.
          adb logcat -v time > "${{ github.workspace }}/emulator_logcat.txt" &
          ./gradlew :app:connectedDebugAndroidTest

    - name: Dump guest logcat on failure
      if: failure()
      run: |
        echo "=== Emulator Logcat (last 1000 lines) ==="
        if [ -f "${{ github.workspace }}/emulator_logcat.txt" ]; then
          tail -n 1000 "${{ github.workspace }}/emulator_logcat.txt"
        else
          echo "Logcat file not found."
        fi

    - name: Upload instrumented test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-test-report
        path: app/build/reports/androidTests/connected/
